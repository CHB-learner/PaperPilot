name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (e.g. 1.4.4). Leave empty for patch bump."
        required: false
        type: string
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Bump version (manual publish)
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION_INPUT="${{ github.event.inputs.version }}"
          if [ -n "${VERSION_INPUT}" ]; then
            python - "${VERSION_INPUT}" <<'PY'
          import re
          import sys
          from pathlib import Path

          new_version = sys.argv[1].strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", new_version):
              raise SystemExit("version must look like 1.2.3")

          pyproject = Path("pyproject.toml")
          init_file = Path("literature_agent/__init__.py")

          pyproject_text = pyproject.read_text(encoding="utf-8")
          match = re.search(r'^version\s*=\s*"([^"]+)"', pyproject_text, re.M)
          if not match:
              raise SystemExit("No project version found in pyproject.toml")
          old_version = match.group(1)

          pyproject.write_text(
              re.sub(
                  r'^version\s*=\s*"[^"]+"',
                  f'version = "{new_version}"',
                  pyproject_text,
                  count=1,
                  flags=re.M,
              ),
              encoding="utf-8",
          )

          init_text = init_file.read_text(encoding="utf-8")
          if not re.search(r'__version__\s*=\s*"[^"]+"', init_text):
              raise SystemExit("No __version__ assignment found in literature_agent/__init__.py")
          updated_init = re.sub(
              r'__version__\s*=\s*"[^"]+"',
              f'__version__ = "{new_version}"',
              init_text,
              count=1,
          )
          init_file.write_text(updated_init, encoding="utf-8")

          print(f"Bumped package metadata from {old_version} to {new_version}")
          PY
          fi
      - name: Build distributions
        run: python -m build
      - name: Build check
        run: |
          ls -l dist
          python -m twine check dist/*
      - name: Publish to PyPI
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
          attestations: false

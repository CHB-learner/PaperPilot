[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paperpilot"
version = "1.3.0"
description = "A CLI research agent for AI-related paper search, code discovery, PDF collection, and bilingual reports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jinja2>=3.1",
  "pypdf>=4.0",
  "reportlab>=4.0",
  "rich>=13.0",
]
keywords = ["literature-review", "research-agent", "papers", "arxiv", "openalex", "openreview"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
literature-agent = "literature_agent.cli:main"
PaperPilot = "literature_agent.cli:main"
paperpilot = "literature_agent.cli:main"

[tool.setuptools.packages.find]
include = ["literature_agent*"]
